# CI: vet + fmt + unit tests + integration tests + secret scan + docker build.
# See docs/CI-CD.md §1 and docs/TESTS.md §8. No secrets needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (vet/fmt/unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)"
      - name: unit + HTTP/WS tests
        run: go test -race ./...
      - name: build binary
        run: go build ./...

  integration:
    name: integration (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: docker-based streaming tests
        # GitHub-hosted runners provide a Docker daemon; integration tests
        # are guarded by the `integration` build tag (see docs/TESTS.md §2).
        run: go test -race -tags integration ./...

  frontend:
    name: frontend filter tests (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: filter predicate tests
        # Explicit file path: `node --test <dir>` directory discovery differs
        # across Node versions (failed on 22 with "Cannot find module 'web'").
        run: node --test web/filters.test.js

  security:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # GITLEAKS_LICENSE is set as a repo/org secret (required by the v3
      # action for organization repos).
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker:
    name: docker build + compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image (no push)
        run: docker build -t pomerium-logsearch:test .
      - name: validate compose file
        run: docker compose config
