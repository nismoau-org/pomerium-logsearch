<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pomerium-logsearch</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>pomerium-logsearch</h1>
    <span id="containerLabel" class="container-label" title="Log source container">pomerium</span>
  </div>
  <div class="controls">
    <button id="followBtn" type="button" class="btn primary" aria-pressed="true">Pause</button>
    <button id="clearBtn" type="button" class="btn">Clear</button>
    <button id="sortBtn" type="button" class="btn" aria-pressed="false" title="Toggle oldest/newest first">Sort: oldest first</button>
    <button id="liveBtn" type="button" class="btn" title="Jump to the newest logs and resume follow">Jump to live</button>
    <button id="colsBtn" type="button" class="btn" aria-haspopup="dialog" aria-expanded="false" title="Show or hide columns">Columns</button>
    <button id="resetFiltersBtn" type="button" class="btn" title="Clear all column filters and the time range">Reset filters</button>
    <input id="searchInput" type="search" placeholder="Search (raw + parsed)…" autocomplete="off" aria-label="Search logs">
    <label class="regex-toggle"><input id="regexToggle" type="checkbox"> Regex</label>
  </div>
  <div id="regexError" class="regex-error" role="alert" hidden></div>
</header>

<div class="colheader-wrap">
<div id="colheader" class="colheader" role="row" aria-label="Columns: click a header to filter it"><div id="colheaderIn" class="colheader-in"></div></div>
<div id="colPop" class="colpop" role="dialog" hidden></div>
</div>
<main id="loglist" tabindex="0" aria-label="Log lines, newest at bottom">
  <div id="logspacer">
    <div id="logtop"></div>
    <div id="logrows"></div>
    <div id="logbottom"></div>
  </div>
  <div id="emptyState" class="empty" hidden>No log lines match the current filters.</div>
</main>

<footer class="statusbar">
  <span id="bufferCount">buffer: 0 / 0</span>
  <span id="connPill" class="pill connecting">connecting</span>
  <span id="lastTs">last: —</span>
  <span id="visibleCount">showing 0 / 0</span>
</footer>

<script type="module" src="./app.js"></script>
</body>
</html>
